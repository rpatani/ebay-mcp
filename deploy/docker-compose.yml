# Demo stack: ebay-mcp (HTTP, keyless free tools) + Prometheus.
#   docker compose -f deploy/docker-compose.yml up --build
#
# NOTE: the image build pins mcp-platform-core from git. The default pyproject
# points at a local file:// path that is NOT reachable inside the container —
# push mcp-platform-py to a git remote and update the [tool.uv.sources] URL
# before building images. For local dev, run `uv run ebay-mcp` instead.
services:
  ebay-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_PATH: /mcp
      MCP_METRICS_PORT: "9464"
      MCP_KEYS_FILE: /app/keys.example.json
      LOG_LEVEL: info
      # EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      # EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
    volumes:
      - ../keys.example.json:/app/keys.example.json:ro
    ports:
      - "8080:8080"
      - "9464:9464"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.1.0
    depends_on:
      ebay-mcp:
        condition: service_healthy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
